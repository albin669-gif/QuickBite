<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QuickBite - Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background-color: #fafaf9;
      color: #1c1917;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #fed7aa;
      color: #ea580c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 8px;
    }
    p {
      font-size: 14px;
      color: #78716c;
      margin: 0 0 24px;
      max-width: 280px;
    }
    button {
      background: #ea580c;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(234, 88, 12, 0.25);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="icon">&#9888;</div>
  <h1>No Internet Connection</h1>
  <p>Please check your mobile data or Wi-Fi connection and try again.</p>
  <button onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
